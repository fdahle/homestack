# Bande (/srv/docker/bande). Login is the app's own account (ADMIN_USER/ADMIN_PASSWORD in .env).
# /ics/… is the calendar feed: calendar apps fetch it without a login, its secret URL is the key.
server {
    listen 80;
    server_name friends.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name friends.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/friends_access.log;
    error_log  /var/log/nginx/friends_error.log;

    # Photos are made small in the browser
    client_max_body_size 10m;

    proxy_http_version 1.1;
    # The app counts failed logins per address, so $remote_addr must be the visitor
    # (real_ip from CF-Connecting-IP in the Cloudflare snippet), not a Cloudflare edge.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://127.0.0.1:3068;
    }

    # WhatsApp chat exports can be large
    location = /api/whatsapp/preview {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:3068;
    }
}
