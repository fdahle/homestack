services:
  stammtisch:
    build: .
    container_name: stammtisch
    restart: unless-stopped
    # Only reachable through nginx on the same machine (see deploy/)
    ports:
      - "127.0.0.1:${PORT:-3068}:3000"
    # A small init as PID 1, so `docker stop` shuts the server down cleanly
    init: true
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REMINDER_HOUR: ${REMINDER_HOUR:-9}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Set to log in through Authelia instead of the own account (kit/README.md)
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      # Fernweh: the secret it fetches your friends' places with, and its address for the map links (README.md)
      LINK_TOKEN: ${LINK_TOKEN:-}
      FERNWEH_URL: ${FERNWEH_URL:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - stammtisch-data:/data

volumes:
  stammtisch-data:
