# Stapel (/srv/docker/stapel). Login is the app's own (ADMIN_USER/ADMIN_PASSWORD in .env).
# Change the subdomain if you pick another one.
#
# The barcode scanner needs the camera and WebAssembly: if security-headers.conf sets a
# Permissions-Policy, it must allow camera=(self); if it sets a Content-Security-Policy,
# script-src needs 'wasm-unsafe-eval'. GCD covers load from files1.comics.org (img-src).
server {
    listen 80;
    server_name stapel.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name stapel.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/stapel_access.log;
    error_log  /var/log/nginx/stapel_error.log;

    # Cover photos taken with the phone
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3067;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # A search may wait for GCD's rate limit
        proxy_read_timeout 120s;
    }
}
