services:
  backlog:
    build: .
    container_name: backlog
    restart: unless-stopped
    # Only reachable through nginx on the same machine (see deploy/)
    ports:
      - "127.0.0.1:${PORT:-3066}:3000"
    # A small init as PID 1, so `docker stop` shuts the server down cleanly
    init: true
    # A runaway scan stops here, not at the machine's memory. Parsing a sitemap of the
    # allowed 50 MB takes about 1.1 GB, so this leaves room for that and little more.
    mem_limit: 1536m
    environment:
      # Your account. APP_PASSWORD (the old name) still works instead of ADMIN_PASSWORD.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${APP_PASSWORD:?Set ADMIN_PASSWORD in .env}}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-12}
      READ_LANGUAGES: ${READ_LANGUAGES:-en,de}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Set to log in through Authelia instead of the own account (kit/README.md)
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - backlog-data:/data

volumes:
  backlog-data:
