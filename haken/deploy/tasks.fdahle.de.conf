# Haken (/srv/docker/homestack/haken). Login is the app's own account (ADMIN_USER/ADMIN_PASSWORD in .env).
# Behind Authelia instead: see deploy/README.md#one-login-for-all-apps (AUTH_PROXY_SECRET, and in
# `location` the homestack-authelia.conf snippet and the secret file instead of the headers below).
server {
    listen 80;
    server_name tasks.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name tasks.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/tasks_access.log;
    error_log  /var/log/nginx/tasks_error.log;

    # A sync after a long time offline can carry many changes
    client_max_body_size 5m;

    location / {
        proxy_http_version 1.1;
        # The app counts failed logins per address, so $remote_addr must be the visitor
        # (real_ip from CF-Connecting-IP in the Cloudflare snippet), not a Cloudflare edge.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://127.0.0.1:3073;
    }
}
# Behind Authelia: calendar apps fetch /ics/<secret>.ics without a login, so that path needs
# Authelia's bypass rule (as Leute's in deploy/authelia.yml) or its own location without the
# Authelia snippet.
