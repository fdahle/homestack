# Regal (/srv/docker/homestack/regal). Login is the app's own account (ADMIN_USER/ADMIN_PASSWORD in .env).
# Behind Authelia instead: see deploy/README.md#one-login-for-all-apps (AUTH_PROXY_SECRET, and in
# `location` the homestack-authelia.conf snippet and the secret file instead of the headers below).
server {
    listen 80;
    server_name books.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name books.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;

    # The shared security-headers.conf turns the camera off for every site; the
    # ISBN scanner needs it here, so this site sets the same headers itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/books_access.log;
    error_log  /var/log/nginx/books_error.log;

    # Cover photos are made small in the browser
    client_max_body_size 10m;

    location / {
        proxy_http_version 1.1;
        # The app counts failed logins per address, so $remote_addr must be the visitor
        # (real_ip from CF-Connecting-IP in the Cloudflare snippet), not a Cloudflare edge.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://127.0.0.1:3072;
        # "Jetzt abgleichen" waits for the Calibre sync, which copies covers
        proxy_read_timeout 120s;
    }
}
