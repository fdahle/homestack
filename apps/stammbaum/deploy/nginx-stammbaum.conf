# Stammbaum (/srv/docker/homestack/apps/stammbaum), behind the homestack Authelia login
# (deploy/README.md#one-login-for-all-apps), with the rules for the `family` group from
# deploy/authelia.yml next to this file. Copy to /etc/nginx/sites-available/, link it into
# sites-enabled/ and `nginx -t && systemctl reload nginx`.
#
# Everything behind this — the page, api/family, api/edits, photos/, thumbs/ — goes through
# the same login. homestack-authelia.conf sets Remote-User to who logged in (and drops
# anything the browser sent under that name); the server trusts it to say who is editing,
# which is why it only listens on the loopback, and only answers requests that also carry
# STAMMBAUM_PROXY_SECRET. Behind the proxy it answers the family, photos/ and api/ only
# when Remote-User names someone, so a too-wide rule in Authelia does not open them.
#
# The secret, the same long random value as STAMMBAUM_PROXY_SECRET in the .env next to
# docker-compose.yml (`openssl rand -hex 32`), goes into
# /etc/nginx/homestack-secrets/stammbaum.conf, readable by root only:
#   proxy_set_header X-Stammbaum-Proxy "replace-with-the-secret";
# It has to be included in `location`, not the server block: nginx drops a server-level
# proxy_set_header from any location that sets headers of its own, as this one does.
# The container does not start without the secret, so set it in both places first.
server {
    listen 80;
    server_name family.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name family.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;
    # Authelia's internal /internal/authelia/authz endpoint
    include /etc/nginx/snippets/authelia-location.conf;

    access_log /var/log/nginx/family_access.log;
    error_log  /var/log/nginx/family_error.log;

    # Photos uploaded in the app; the server itself takes up to 15 MB.
    client_max_body_size 20m;

    location / {
        include /etc/nginx/snippets/homestack-authelia.conf;
        include /etc/nginx/homestack-secrets/stammbaum.conf;
        # docker-compose.yml only publishes the container on the loopback.
        proxy_pass http://127.0.0.1:3065;
    }
}
