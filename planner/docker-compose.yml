services:
  nginx:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3070:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - couchdb

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # Web Push (VAPID) — generate keys with: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3
    restart: unless-stopped
    # Bind to loopback only. nginx and the api reach CouchDB over the internal
    # Docker network (couchdb:5984); the host mapping exists purely so local dev
    # (vite proxy + host-run API) can reach it. Never expose 5984 to the LAN /
    # public — it bypasses nginx's rate limits and blocked admin paths.
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini

volumes:
  couchdb_data:
