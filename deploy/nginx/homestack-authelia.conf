# /etc/nginx/snippets/homestack-authelia.conf
#
# Inside the `location` of an app that logs in through Authelia (AUTH_PROXY_SECRET in the
# app's .env, see kit/README.md). Asks Authelia first, then passes the request on with
# who is logged in. Next to it, the location includes the app's secret and proxy_passes:
#
#   location / {
#       include /etc/nginx/snippets/homestack-authelia.conf;
#       include /etc/nginx/homestack-secrets/checkpoint.conf;
#       proxy_pass http://127.0.0.1:3069;
#   }
#
# All proxy headers live in here, not in the server block: nginx drops server-level
# proxy_set_header lines in any location that sets headers of its own.

# Authelia's snippet: auth_request, and $user, $groups, $name, $email from its answer.
# A 401 sends the browser to the login portal.
include /etc/nginx/snippets/authelia-authrequest.conf;

proxy_http_version 1.1;
# The apps count failed logins per address, so $remote_addr must be the visitor
# (real_ip from CF-Connecting-IP in the Cloudflare snippet), not a Cloudflare edge.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# Who logged in. Set here, these replace anything the browser sent, and an empty
# value drops the header, so nobody can claim to be someone else.
proxy_set_header Remote-User   $user;
proxy_set_header Remote-Name   $name;
proxy_set_header Remote-Email  $email;
proxy_set_header Remote-Groups $groups;
