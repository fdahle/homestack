# Stammtisch (/srv/docker/homestack/apps/stammtisch), behind the homestack Authelia login
# (deploy/README.md#one-login-for-all-apps). Needs AUTH_PROXY_SECRET in the app's .env and the
# same value in /etc/nginx/homestack-secrets/stammtisch.conf:
#   proxy_set_header X-Auth-Proxy-Secret "<openssl rand -hex 32>";
#
# /ics/… is the calendar feed: calendar apps fetch it without a login, its secret URL is the key.
# Authelia lets it through (the bypass rule for friends.fdahle.de in deploy/authelia.yml), so it
# needs nothing here. Fernweh fetches the friends' places over the Docker network, not through nginx.
#
# Without Authelia: leave AUTH_PROXY_SECRET empty, drop the two includes in `location`
# and the authelia-location include, and put the proxy_set_header lines from
# deploy/nginx/homestack-authelia.conf (all but Remote-*) into `location` instead.
server {
    listen 80;
    server_name friends.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name friends.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;
    # Authelia's internal /internal/authelia/authz endpoint
    include /etc/nginx/snippets/authelia-location.conf;

    access_log /var/log/nginx/friends_access.log;
    error_log  /var/log/nginx/friends_error.log;

    # Photos are made small in the browser
    client_max_body_size 10m;

    location / {
        include /etc/nginx/snippets/homestack-authelia.conf;
        include /etc/nginx/homestack-secrets/stammtisch.conf;
        proxy_pass http://127.0.0.1:3068;
    }
}
