# Regal (/srv/docker/homestack/regal), behind the homestack Authelia login
# (deploy/README.md#one-login-for-all-apps). Needs AUTH_PROXY_SECRET in the app's .env and the
# same value in /etc/nginx/homestack-secrets/regal.conf:
#   proxy_set_header X-Auth-Proxy-Secret "<openssl rand -hex 32>";
#
# Without Authelia: leave AUTH_PROXY_SECRET empty, drop the two includes in `location`
# and the authelia-location include, and put the proxy_set_header lines from
# deploy/nginx/homestack-authelia.conf (all but Remote-*) into `location` instead.
server {
    listen 80;
    server_name books.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name books.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    # Authelia's internal /internal/authelia/authz endpoint
    include /etc/nginx/snippets/authelia-location.conf;

    # The shared security-headers.conf turns the camera off for every site; the
    # ISBN scanner needs it here, so this site sets the same headers itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/books_access.log;
    error_log  /var/log/nginx/books_error.log;

    # Cover photos are made small in the browser
    client_max_body_size 10m;

    location / {
        include /etc/nginx/snippets/homestack-authelia.conf;
        include /etc/nginx/homestack-secrets/regal.conf;
        proxy_pass http://127.0.0.1:3072;
        # "Jetzt abgleichen" waits for the Calibre sync, which copies covers
        proxy_read_timeout 120s;
    }
}
