# The parts of Authelia's configuration.yml for the homestack apps behind it.
# Merge them into the existing file; don't replace it. See README.md#one-login-for-all-apps.
#
# Behind Authelia: the apps with personal data, Stammtisch (friends.fdahle.de) and Stammbaum
# (family.fdahle.de). The lists (games, watch, books, comics, read) keep their own
# password, and Fernweh and Notizbuch their own login (both ready for Authelia). To add one later, give it a rule
# like Stammtisch's and switch its nginx config to the Authelia version.

session:
  cookies:
    # One cookie for fdahle.de covers every subdomain: log in once, every app behind it knows you.
    - domain: fdahle.de
      authelia_url: https://auth.fdahle.de
      # With "remember me" ticked, the login lasts that long. Tick it on your own devices only.
      remember_me: 180d

access_control:
  default_policy: deny
  rules:
    # --- what has to work without the login cookie (before the rules below) ---

    # Calendar apps fetch Stammtisch's feed on their own; the link carries its own secret token.
    # Phones fetch the icon and manifest when you add the app to the home screen,
    # sometimes without cookies. Nothing private in them.
    - domain: friends.fdahle.de
      resources:
        - '^/ics/'
        - '^/(manifest\.webmanifest|icon[^/]*\.(png|svg)|favicon\.ico|sw\.js)$'
      policy: bypass

    # --- personal data: a second factor (asked once per login, so rarely with "remember me") ---

    # Friends: addresses, phone numbers, what you know about them. Only you.
    - domain: friends.fdahle.de
      subject: 'group:admin'
      policy: two_factor

    # The family (Stammbaum) has its own rules for the `family` group; see stammbaum/deploy/authelia.yml.

    # --- apps that are still on their own password, for the day they move behind Authelia ---
    #
    # Watchlist, Checkpoint, Regal, Backlog and Fernweh keep ONE library: whoever gets in may
    # read, change, export and delete all of it (and Backlog's discovery spends Claude credit).
    # So "only you", never a plain one_factor rule for everyone with an Authelia account.
    # Also set AUTH_PROXY_USERS=felix in their .env: the app then lets nobody else in, even
    # if a rule here is ever too wide. Stapel, Notizbuch and To-do keep each person's data
    # apart; give them the people who should have an account (e.g. 'group:family').
    #
    # - domain: [watch.fdahle.de, games.fdahle.de, books.fdahle.de, read.fdahle.de]
    #   subject: 'group:admin'
    #   policy: one_factor
    #
    # Fernweh's share links work for people without an account (before its own rule):
    # - domain: places.fdahle.de
    #   resources:
    #     - '^/share/'
    #     - '^/api/public/share/'
    #     - '^/assets/'
    #     - '^/(icon.svg|icon-(180|192|512|maskable-512).png|manifest.webmanifest|sw.js)
    # - domain: tasks.fdahle.de
    #   resources: ['^/ics/', '^/(manifest.webmanifest|icon[^/]*.(png|svg)|favicon.ico|sw.js)
# You are a user in the `admin` group (users_database.yml, hash with
# `authelia crypto hash generate argon2`):
#
# users:
#   felix:
#     displayname: "Felix"
#     password: "$argon2id$..."
#     email: you@example.com
#     groups: [admin]
]
