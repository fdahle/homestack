# Rate-limit zones. `auth` covers the sensitive write endpoints (login, register,
# change-password); `poll` is a looser bucket for the GET endpoints the client
# polls automatically (/me, /config) so normal use doesn't trip the limiter;
# `sync` covers CouchDB replication traffic.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=poll:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sync:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # Real client address. This container sits behind the host's reverse proxy,
    # so without this every request appears to come from the proxy and all
    # clients share one rate-limit bucket. Trust X-Forwarded-For only from
    # loopback / private (Docker) ranges. Non-recursive: take the LAST entry,
    # which the host proxy appends itself (it already resolves Cloudflare IPs),
    # so a client-supplied XFF prefix can't spoof it. $remote_addr is then the
    # client, and $proxy_add_x_forwarded_for passes it on to the API as the last
    # entry (Express trusts exactly one hop).
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    # Security headers (`always` so they're sent on error responses too)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The SPA only loads its own bundled assets and talks to same-origin /api
    # and /db. 'unsafe-inline' is required for Vue's injected styles. No inline
    # scripts are used, so script-src stays locked to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Polled GET endpoints (/me, /config) — looser limit so the client's
    # automatic polling on load / route change doesn't exhaust the auth budget.
    location ~ ^/api/auth/(me|config)$ {
        limit_req zone=poll burst=20 nodelay;
        proxy_pass         http://api:3000$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Never let a 401 carry a Basic challenge to the browser — that triggers
        # the native sign-in dialog instead of our in-app /login redirect.
        proxy_hide_header  WWW-Authenticate;
    }

    # Auth / API — rate limited
    location /api/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://api:3000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  WWW-Authenticate;
    }

    # CouchDB sync — the ONLY CouchDB paths exposed: a per-user notes database
    # (notes_<uuid>) and its sub-paths, which is all PouchDB uses. Login goes
    # through /api. Everything else (_users, _session, _all_dbs, _replicate,
    # _replicator, _scheduler, _utils, _node, …) falls through to the 403 below.
    # nginx matches the decoded, dot-segment-normalised URI, so %-encoding or
    # `..` can't smuggle another path past this regex. (Quoted: nginx would
    # otherwise read the `{` of a regex quantifier as a block.)
    location ~ "^/db/notes_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/|$)" {
        limit_req zone=sync burst=20 nodelay;
        # Attachments (up to MAX_ATTACHMENT_SIZE_MB, default 10 MB) are pushed
        # base64-inlined in _bulk_docs (+33%), and one batch can carry several.
        client_max_body_size 50m;
        rewrite   ^/db/(.*)$ /$1 break;
        proxy_pass         http://couchdb:5984;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # CouchDB re-issues AuthSession on its own once a session ages; keep the
        # flags the API sets at login so the refreshed cookie doesn't lose them.
        proxy_cookie_flags AuthSession httponly secure samesite=strict;
        proxy_hide_header  WWW-Authenticate;
    }

    # Server root (read-only): PouchDB GETs it once per replication for the
    # server uuid it builds the checkpoint id from.
    location = /db/ {
        limit_req zone=sync burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass         http://couchdb:5984/;
        proxy_set_header   Host $host;
        proxy_cookie_flags AuthSession httponly secure samesite=strict;
        proxy_hide_header  WWW-Authenticate;
    }

    location /db/ {
        return 403;
    }

    # SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Service worker must never be cached by the browser — it controls the cache.
    # add_header here replaces the server-level headers, so re-declare the
    # security headers to keep them on this response.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
