services:
  stapel:
    build: .
    container_name: stapel
    restart: unless-stopped
    # Only reachable through nginx on the same machine (see deploy/)
    ports:
      - "127.0.0.1:${PORT:-3067}:3000"
    # A small init as PID 1, so `docker stop` shuts the server down cleanly
    init: true
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GCD_EMAIL: ${GCD_EMAIL:-}
      GCD_PASSWORD: ${GCD_PASSWORD:-}
      GCD_BACKGROUND_PER_HOUR: ${GCD_BACKGROUND_PER_HOUR:-}
      COMICVINE_API_KEY: ${COMICVINE_API_KEY:-}
      # Set to log in through Authelia instead of the own accounts (kit/README.md)
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - stapel-data:/data

volumes:
  stapel-data:
