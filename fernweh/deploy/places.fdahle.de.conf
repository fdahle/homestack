# Fernweh (/srv/docker/homestack/fernweh), behind the homestack Authelia login
# (deploy/README.md#one-login-for-all-apps). Needs AUTH_PROXY_SECRET in the app's .env and the
# same value in /etc/nginx/homestack-secrets/fernweh.conf:
#   proxy_set_header X-Auth-Proxy-Secret "<openssl rand -hex 32>";
#
# Shared map views (/share/…, /api/public/share/…, and the /assets/ they load) are for people
# without a login: Authelia lets them through (the bypass rule for places.fdahle.de in
# deploy/authelia.yml), Remote-User is then empty, and Fernweh answers them without a login
# (a share link's own password, if it has one, still applies).
#
# Without Authelia: leave AUTH_PROXY_SECRET empty, drop the two includes in `location`
# and the authelia-location include, and put the proxy_set_header lines from
# deploy/nginx/homestack-authelia.conf (all but Remote-*) into `location` instead.
# Fernweh then asks for its own password.
server {
    listen 80;
    server_name places.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name places.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;
    # Authelia's internal /internal/authelia/authz endpoint
    include /etc/nginx/snippets/authelia-location.conf;

    access_log /var/log/nginx/places_access.log;
    error_log  /var/log/nginx/places_error.log;

    # Imports go up in batches of 100 places (the app takes 2 MB per request)
    client_max_body_size 4m;

    # The app doesn't compress its answers itself; the marker list and the map code are large
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        include /etc/nginx/snippets/homestack-authelia.conf;
        include /etc/nginx/homestack-secrets/fernweh.conf;
        proxy_pass http://127.0.0.1:3063;
    }

    # Settings → Data: restoring a backup uploads the whole file (the app takes up to 100 MB),
    # and downloading the complete database takes a snapshot first
    location ~ ^/api/backup/(restore|database)$ {
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include /etc/nginx/snippets/homestack-authelia.conf;
        include /etc/nginx/homestack-secrets/fernweh.conf;
        proxy_pass http://127.0.0.1:3063;
    }
}
