# Watchlist (/srv/docker/homestack/apps/watchlist). Login is the app's own account (ADMIN_USER/ADMIN_PASSWORD in .env).
# Behind Authelia instead: see deploy/README.md#one-login-for-all-apps (AUTH_PROXY_SECRET, and in
# `location` the homestack-authelia.conf snippet and the secret file instead of the headers below).
server {
    listen 80;
    server_name watch.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name watch.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/watch_access.log;
    error_log  /var/log/nginx/watch_error.log;

    # Poster photos are made small in the browser; a Watcharr export can be a few MB
    client_max_body_size 50m;

    location / {
        proxy_http_version 1.1;
        # The app counts failed logins per address, so $remote_addr must be the visitor
        # (real_ip from CF-Connecting-IP in the Cloudflare snippet), not a Cloudflare edge.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://127.0.0.1:3071;
    }
}
