# Stapel (/srv/docker/stapel). While it is being built, nginx asks for a
# password first (comics.htpasswd); then comes the app's own login
# (ADMIN_USER/ADMIN_PASSWORD in .env). Drop the two auth_basic lines to open it up.
server {
    listen 80;
    server_name comics.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name comics.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;

    # The shared security-headers.conf turns the camera off for every site; the
    # barcode scanner needs it here, so this site sets the same headers itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/comics_access.log;
    error_log  /var/log/nginx/comics_error.log;

    auth_basic           "Stapel";
    auth_basic_user_file /etc/nginx/comics.htpasswd;

    # Cover photos taken with the phone
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3067;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # A search may wait for GCD's rate limit
        proxy_read_timeout 120s;
    }
}
