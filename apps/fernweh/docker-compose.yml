services:
  app:
    build: .
    ports:
      # Only reachable through the reverse proxy on this host. If the proxy runs elsewhere, set
      # BIND_ADDRESS to an address only it can reach. Sign-in needs HTTPS, so always go through the proxy.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3063}:3000"
    volumes:
      # Must be writable by uid 1000 (the container's node user): mkdir -p data && sudo chown 1000:1000 data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Set to sign in through the homestack login (Authelia) instead of Fernweh's password (README.md)
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:-}
      # Only these homestack logins (comma-separated) may use it; empty: whoever Authelia lets through
      - AUTH_PROXY_USERS=${AUTH_PROXY_USERS:-}
      # Friends and their addresses from Stammtisch; off while STAMMTISCH_URL or STAMMTISCH_LINK_TOKEN is empty (README.md)
      - STAMMTISCH_URL=${STAMMTISCH_URL:-}
      - STAMMTISCH_LINK_TOKEN=${STAMMTISCH_LINK_TOKEN:-}
      - STAMMTISCH_PUBLIC_URL=${STAMMTISCH_PUBLIC_URL:-}
      - STAMMTISCH_SYNC_HOURS=${STAMMTISCH_SYNC_HOURS:-6}
      - TZ=${TZ:-Europe/Berlin}
    init: true
    restart: unless-stopped
