# Rate-limit zones. `auth` covers the sensitive write endpoints (login, register,
# change-password); `poll` is a looser bucket for the GET endpoints the client
# polls automatically (/me, /config) so normal use doesn't trip the limiter;
# `sync` covers CouchDB replication traffic.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=poll:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sync:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # Security headers (`always` so they're sent on error responses too)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The SPA only loads its own bundled assets and talks to same-origin /api
    # and /db. 'unsafe-inline' is required for Vue's injected styles. No inline
    # scripts are used, so script-src stays locked to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Polled GET endpoints (/me, /config) — looser limit so the client's
    # automatic polling on load / route change doesn't exhaust the auth budget.
    location ~ ^/api/auth/(me|config)$ {
        limit_req zone=poll burst=20 nodelay;
        proxy_pass         http://api:3000$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Never let a 401 carry a Basic challenge to the browser — that triggers
        # the native sign-in dialog instead of our in-app /login redirect.
        proxy_hide_header  WWW-Authenticate;
    }

    # Auth / API — rate limited
    location /api/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://api:3000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  WWW-Authenticate;
    }

    # Block CouchDB admin/cluster paths
    location ~ ^/db/(_utils|_node|_cluster_setup|_membership) {
        return 403;
    }

    # CouchDB sync — rate limited, strip /db prefix
    location /db/ {
        limit_req zone=sync burst=20 nodelay;
        rewrite   ^/db/(.*)$ /$1 break;
        proxy_pass         http://couchdb:5984;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_pass_header  Set-Cookie;
        proxy_hide_header  WWW-Authenticate;
    }

    # SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Service worker must never be cached by the browser — it controls the cache.
    # add_header here replaces the server-level headers, so re-declare the
    # security headers to keep them on this response.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
