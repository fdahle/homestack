services:
  haken:
    build: .
    container_name: haken
    restart: unless-stopped
    # Only reachable through nginx on the same machine (see deploy/)
    ports:
      - "127.0.0.1:${PORT:-3073}:3000"
    # A small init as PID 1, so `docker stop` shuts the server down cleanly
    init: true
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRASH_DAYS: ${TRASH_DAYS:-7}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Set to log in through Authelia instead of the own account (design/README.md)
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      # Due times and reminders are in this time zone
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - haken-data:/data

volumes:
  haken-data:
