<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18161a" media="(prefers-color-scheme: dark)">
<!-- Light or dark as chosen in the settings, before the first paint (kit/theme.js) -->
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Haken</title>
<!-- With cookies, so the manifest also loads behind a login proxy -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>

<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
