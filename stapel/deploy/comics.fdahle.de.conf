# Stapel (/srv/docker/stapel), behind Authelia (group admin) while it is being
# built, then the app's own login (ADMIN_USER/ADMIN_PASSWORD in .env).
# Without Authelia, drop the two authelia includes.
server {
    listen 80;
    server_name comics.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name comics.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;

    # The shared security-headers.conf turns the camera off for every site; the
    # barcode scanner needs it here, so this site sets the same headers itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/comics_access.log;
    error_log  /var/log/nginx/comics_error.log;

    include /etc/nginx/snippets/authelia-location.conf;

    # Cover photos taken with the phone
    client_max_body_size 16m;

    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        proxy_pass http://127.0.0.1:3067;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # A search may wait for GCD's rate limit
        proxy_read_timeout 120s;
    }
}
