# Backlog (/srv/docker/backlog). Login is the app's own password (APP_PASSWORD in .env).
server {
    listen 80;
    server_name read.fdahle.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name read.fdahle.de;

    include /etc/nginx/snippets/ssl-fdahle.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/read_access.log;
    error_log  /var/log/nginx/read_error.log;

    # Restoring a backup (Tools → Import) uploads the whole export
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3066;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Adding a blog or testing its settings can take a while
        proxy_read_timeout 300s;
    }
}
