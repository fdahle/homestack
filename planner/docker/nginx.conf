limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sync:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Auth API — rate limited
    location /api/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://server:3000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block CouchDB admin/cluster paths
    location ~ ^/db/(_utils|_node|_cluster_setup|_membership) {
        return 403;
    }

    # CouchDB sync — rate limited, strip /db prefix
    location /db/ {
        limit_req zone=sync burst=20 nodelay;
        rewrite   ^/db/(.*)$ /$1 break;
        proxy_pass         http://couchdb:5984;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_pass_header  Set-Cookie;
        proxy_hide_header  WWW-Authenticate;
    }

    # SPA fallback
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Service worker must never be cached by the browser — it controls the cache
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
