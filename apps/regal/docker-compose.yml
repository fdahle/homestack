services:
  regal:
    build: .
    container_name: regal
    restart: unless-stopped
    # Only reachable through nginx on the same machine (see deploy/)
    ports:
      - "127.0.0.1:${PORT:-3072}:3000"
    # A small init as PID 1, so `docker stop` shuts the server down cleanly
    init: true
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # The Calibre library itself is mounted in docker-compose.override.yml (see the README)
      CALIBRE_SYNC_HOURS: ${CALIBRE_SYNC_HOURS:-6}
      CALIBRE_WEB_URL: ${CALIBRE_WEB_URL:-}
      # Set to log in through Authelia instead of the own account (kit/README.md)
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - regal-data:/data

volumes:
  regal-data:
