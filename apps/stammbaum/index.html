<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Stammbaum — wer ist noch mal wer?" />
    <meta name="theme-color" content="#fffefc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211f1d" media="(prefers-color-scheme: dark)" />
    <!-- Light or dark as chosen in the menu, before the first paint (kit/theme.js) -->
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <!-- With cookies, so the manifest also loads behind a login proxy -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <title>Stammbaum</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-bar">
        <a href="#/" class="btn btn-ghost brand">
          <span
            class="crest"
            id="crest"
          ></span>
          <span id="family-title" class="family-title">Stammbaum</span>
        </a>

        <div class="app-actions"></div>

        <div class="search" role="search">
          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Wer ist das?"
            aria-label="Person suchen"
            role="combobox"
            aria-controls="results"
            aria-autocomplete="list"
            aria-expanded="false"
            class="input search-input"
          />
          <ul id="results" class="results menu" role="listbox" hidden></ul>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
    <!-- What the toasts say, read out by screen readers: one region, its text replaced. -->
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
